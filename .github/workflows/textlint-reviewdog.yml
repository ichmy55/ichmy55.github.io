name: textlint-reviewdog

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  textlint-reviewdog:
    runs-on:  ubuntu-26.04
    container:
      image : ghcr.io/ichmy55/ichmy55.github.io/httpd:main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      # Run reviewdog
      - name: Run reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make local-lint | reviewdog -f=tsc -reporter=github-pr-review  -fail-level=error
