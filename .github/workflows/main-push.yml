name:  JOBS at push to main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package-httpd:
    uses: ./.github/workflows/package-httpd.yml

  release-drafter:
    uses: ./.github/workflows/release-drafter.yml
